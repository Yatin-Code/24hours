<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hours — one thing, one deadline</title>
<meta name="description" content="A tiny, dependency-free countdown + focus timer. Missed nothing; finished one thing.">
<style>
  :root{
    --bg:#0b0d10; --panel:#13161b; --fg:#e7eaee; --muted:#8a93a0;
    --accent:#5eead4; --accent2:#a78bfa; --warn:#fbbf24; --danger:#f87171;
    --ring:#1f2430;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{width:min(520px,100%);background:var(--panel);border:1px solid #1e222a;
    border-radius:20px;padding:28px 26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  h1{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .ring-wrap{position:relative;width:260px;height:260px;margin:0 auto 18px}
  svg{transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:var(--ring);stroke-width:10}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;
    transition:stroke-dashoffset .4s ease,stroke .4s ease}
  .time{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px}
  .time .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .time .pct{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .focus{margin:6px 0 16px;padding:12px 14px;border-radius:12px;
    background:#0d1015;border:1px solid #1e222a;display:flex;gap:10px;align-items:center}
  .focus input{flex:1;background:transparent;border:0;color:var(--fg);font-size:15px;outline:none}
  .focus input::placeholder{color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{background:#1a1e26;color:var(--fg);border:1px solid #262b36;
    padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s}
  button:hover{background:#222833;border-color:#333a47}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent);color:#06201b;border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.05)}
  button.danger{background:var(--danger);color:#2a0b0b;border-color:var(--danger)}
  input[type=text],input[type=datetime-local]{background:#0d1015;color:var(--fg);
    border:1px solid #1e222a;padding:9px 12px;border-radius:10px;font-size:13px;flex:1;min-width:0}
  .settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .chip{font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px;
    border:1px solid #262b36;cursor:pointer}
  .chip:hover{color:var(--fg);border-color:#3b4250}
  .log{margin-top:14px;padding:12px 14px;border-radius:12px;background:#0d1015;
    border:1px solid #1e222a;max-height:150px;overflow:auto;font-family:ui-monospace,Menlo,monospace;
    font-size:12px;color:var(--muted)}
  .log div{padding:2px 0;border-bottom:1px solid #161a21}
  .log div:last-child{border-bottom:0}
  .foot{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
  .foot a{color:var(--accent);text-decoration:none}
  .status{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;min-height:16px}
  .cols{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  @media(max-width:480px){.ring-wrap{width:220px;height:220px}.time .big{font-size:38px}.settings{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <h1>hours</h1>
  <div class="sub">one thing, one deadline. everything else can wait.</div>

  <div class="ring-wrap">
    <svg viewBox="0 0 260 260" width="260" height="260">
      <circle class="ring-bg" cx="130" cy="130" r="118"/>
      <circle class="ring-fg" id="ring" cx="130" cy="130" r="118"
              stroke-dasharray="741.4" stroke-dashoffset="0"/>
    </svg>
    <div class="time">
      <div class="big" id="big">--:--:--</div>
      <div class="pct" id="pct">0% elapsed</div>
    </div>
  </div>

  <div class="focus">
    <span style="color:var(--muted)">focus:</span>
    <input id="focus" type="text" placeholder="the one thing you are doing now" />
  </div>

  <div class="cols">
    <button class="chip" data-dur="25m">pomodoro 25m</button>
    <button class="chip" data-dur="50m">deep work 50m</button>
    <button class="chip" data-dur="1h">one hour</button>
    <button class="chip" data-dur="2h">two hours</button>
    <button class="chip" id="pick">custom…</button>
  </div>

  <div class="settings" id="settings">
    <label>deadline (date/time)
      <input type="datetime-local" id="dt"/>
    </label>
    <label>sound
      <select id="sound" style="background:#0d1015;color:var(--fg);border:1px solid #1e222a;padding:9px 12px;border-radius:10px;font-size:13px">
        <option value="on">on</option>
        <option value="off">off</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button class="primary" id="start">start</button>
    <button id="pause">pause</button>
    <button id="reset">reset</button>
    <button id="finish">finish now</button>
  </div>
  <div class="status" id="status">idle</div>

  <div class="log" id="log"><div><em>milestones appear here</em></div></div>

  <div class="foot">built in one day · <a href="https://github.com/Yatin-Code/24hours">source</a> · no tracking, no backend</div>
</div>

<script>
(function(){
  const CIRC=2*Math.PI*118; // 741.4
  const ring=document.getElementById('ring');
  const big=document.getElementById('big');
  const pct=document.getElementById('pct');
  const focus=document.getElementById('focus');
  const dt=document.getElementById('dt');
  const soundSel=document.getElementById('sound');
  const status=document.getElementById('status');
  const log=document.getElementById('log');
  const startBtn=document.getElementById('start');

  ring.setAttribute('stroke-dasharray', CIRC);

  let target=null, total=null, paused=false, pausedRemaining=null, timer=null, hit=new Set();
  const MILESTONES=[0.1,0.25,0.5,0.75,0.9,1.0];

  function fmt(s){
    s=Math.max(0,Math.floor(s));
    const d=Math.floor(s/86400), r=s%86400;
    const h=Math.floor(r/3600), m=Math.floor((r%3600)/60), sec=r%60;
    if(d) return d+'d '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }
  function addLog(msg){
    const div=document.createElement('div');
    div.textContent=new Date().toLocaleTimeString()+'  '+msg;
    log.prepend(div);
  }
  function chime(){
    if(soundSel.value==='off') return;
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12,ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+0.35);
    }catch(e){}
  }
  function render(){
    if(target===null) return;
    const now=Date.now()/1000;
    let remaining;
    if(paused){ remaining=pausedRemaining; }
    else { remaining=target-now; }
    if(remaining<0) remaining=0;
    const elapsed = paused ? (total-pausedRemaining) : (now-(target-total));
    const pctv = Math.min(1, Math.max(0, elapsed/total));
    big.textContent=fmt(remaining);
    pct.textContent=Math.round(pctv*100)+'% elapsed';
    ring.style.strokeDashoffset = CIRC*(1-pctv);
    ring.style.stroke = pctv>=1 ? 'var(--warn)' : 'var(--accent)';
    // milestones
    for(const ms of MILESTONES){
      if(!hit.has(ms) && pctv>=ms){
        hit.add(ms);
        const label = ms>=1 ? '100% done' : (Math.round(ms*100)+'% elapsed');
        addLog(label+'  ('+fmt(remaining)+' left)');
        chime();
      }
    }
    if(!paused && remaining<=0){
      status.textContent='done. time is up.';
      addLog('FINISHED');
      chime();
      stop();
    }
  }
  function tick(){ render(); if(target!==null && !paused) timer=setTimeout(tick,250); }
  function start(){
    hit=new Set(); paused=false; pausedRemaining=null;
    if(target===null){
      // build target from dt or default 25m
      let t;
      if(dt.value){ t=new Date(dt.value).getTime()/1000; }
      else { t=Date.now()/1000 + 25*60; }
      if(isNaN(t)){ status.textContent='bad deadline'; return; }
      target=t;
      total=target-(Date.now()/1000);
      if(total<=0){ status.textContent='deadline in the past'; target=null; return; }
    } else if(paused){
      target = Date.now()/1000 + pausedRemaining;
      paused=false; pausedRemaining=null;
    }
    status.textContent='running · '+(focus.value||'focus');
    try{ localStorage.setItem('hours_focus', focus.value); }catch(e){}
    tick();
  }
  function pause(){
    if(target===null || paused) return;
    paused=true; pausedRemaining=target-Date.now()/1000;
    if(timer) clearTimeout(timer); timer=null;
    status.textContent='paused';
    render();
  }
  function stop(){ if(timer){clearTimeout(timer);timer=null;} }
  function reset(){
    stop(); target=null; total=null; paused=false; pausedRemaining=null; hit=new Set();
    big.textContent='--:--:--'; pct.textContent='0% elapsed';
    ring.style.strokeDashoffset=0; status.textContent='idle'; log.innerHTML='<div><em>milestones appear here</em></div>';
  }
  function setDur(dur){
    // parse like 25m, 1h, 2h, 50m
    let s=dur.trim(); let mins=0;
    const m=s.match(/^(\d+)\s*([mh])$/i);
    if(m){ const v=+m[1]; mins = m[2].toLowerCase()==='h' ? v*60 : v; }
    else { mins=25; }
    const d=new Date(Date.now()+mins*60000);
    // format for datetime-local
    const pad=x=>String(x).padStart(2,'0');
    dt.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  startBtn.addEventListener('click', start);
  document.getElementById('pause').addEventListener('click', pause);
  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('finish').addEventListener('click', function(){ if(target){ target=Date.now()/1000; render(); }});
  document.getElementById('pick').addEventListener('click', function(){ dt.focus(); });
  document.querySelectorAll('.chip[data-dur]').forEach(c=>c.addEventListener('click',()=>setDur(c.dataset.dur)));
  // init
  try{ const f=localStorage.getItem('hours_focus'); if(f) focus.value=f; }catch(e){}
  setDur('25m');
  status.textContent='idle — set a focus, pick a duration, press start';
})();
</script>
</body>
</html>
